[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-archive"
version = "0.1.0"
description = "Local app for your WhatsApp chats from an iPhone backup: export, voice transcription and RAG search. Based on WhatsApp-Chat-Exporter."
readme = "README.md"
authors = [
    { name = "whatsapp-archive contributors" },
    { name = "KnugiHK (WhatsApp-Chat-Exporter)" }
]
license = { text = "MIT" }
keywords = [
    "android", "ios", "parsing", "history", "iphone", "message", "crypt15",
    "customizable", "whatsapp", "android-backup", "messages", "crypt14", 
    "crypt12", "whatsapp-chat-exporter", "whatsapp-export", "iphone-backup",
    "whatsapp-database", "whatsapp-database-parser", "whatsapp-conversations",
    "transcription", "whisper", "rag", "ollama"
]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Communications :: Chat",
    "Topic :: Utilities",
    "Topic :: Database"
]
requires-python = ">=3.10"
dependencies = [
    "jinja2",
    "bleach",
    "tqdm"
]

[project.optional-dependencies]
android_backup = ["pycryptodome", "javaobj-py3"]
crypt12 = ["pycryptodome"]
crypt14 = ["pycryptodome"]
crypt15 = ["pycryptodome", "javaobj-py3"]
all = ["pycryptodome", "javaobj-py3"]
everything = ["pycryptodome", "javaobj-py3"]
backup = ["pycryptodome", "javaobj-py3"]
app = ["fastapi", "uvicorn[standard]", "httpx", "numpy", "faster-whisper", "av<19"]

[project.scripts]
wtsexporter = "Whatsapp_Chat_Exporter.__main__:main"
whatsapp-archive = "whatsapp_archive.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["Whatsapp_Chat_Exporter", "whatsapp_archive"]

[tool.setuptools.package-data]
Whatsapp_Chat_Exporter = ["*.html"]
whatsapp_archive = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests", "tools/export_whatsapp/tests"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
